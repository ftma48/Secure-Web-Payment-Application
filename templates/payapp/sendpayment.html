{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Send Payment{% endblock %}

{% block content %}
    <h2>Send Payment</h2>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-success">Send</button>
                <a href="{% url 'index' %}" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
