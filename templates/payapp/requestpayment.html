{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Request Payment{% endblock %}

{% block content %}
    <h2>Request Payment</h2>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Send Request</button>
                <a href="{% url 'index' %}" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
